<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c92327"><title>Automotive Tech for Kids</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#172338;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;min-height:48px;border:0;border-radius:14px;font-weight:750;padding:12px 18px}button:focus-visible{outline:4px solid #f9b928;outline-offset:3px}.wrap{max-width:950px;margin:auto;padding:16px}.hero{background:linear-gradient(130deg,#c92327,#7e1521);color:white;padding:24px 16px;border-radius:0 0 26px 26px}.hero h1{margin:0;font-size:clamp(26px,6vw,42px)}.hero p{margin:8px 0 0}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.nav button{background:white;color:#28364d;border:2px solid #dae1ec;flex:1}.nav button[aria-current=page]{background:#193f70;color:white}.panel{background:white;border-radius:22px;padding:clamp(16px,4vw,30px);box-shadow:0 8px 25px #182e4b12;margin-bottom:16px}.panel h2{margin-top:0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{border:2px solid #dce4ed;border-radius:18px;padding:18px;text-align:left;background:#fff;color:#182d46}.card:hover{border-color:#2673ba}.emoji{font-size:44px;display:block;margin-bottom:10px}.muted{color:#536276}.primary{background:#c92327;color:white}.secondary{background:#e8f0fa;color:#183f6c}.answer{display:block;width:100%;text-align:left;margin:10px 0;background:#edf3fa;color:#192d45;border:2px solid #d5e1f0}.answer:disabled{opacity:.72;cursor:default}.correct{border-color:#17784b;background:#d8f5e4}.wrong{border-color:#aa2631;background:#ffeaeb}.notice{padding:14px;border-radius:14px;background:#e7f2ff;margin:16px 0;font-weight:650}.safety{background:#fff2d7;color:#633c00;padding:14px;border-radius:14px}.meter{height:14px;background:#dce5f0;border-radius:10px;overflow:hidden}.meter>div{height:100%;background:#17784b;transition:width .2s}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}.tag{background:#ffe5b3;border-radius:50px;padding:5px 10px;font-size:13px}.garage{font-size:75px;text-align:center;background:#e5f0fc;border-radius:18px;padding:20px}.learning-grid{display:grid;grid-template-columns:1fr;gap:16px}.learning-card{background:#fff;border:2px solid #dce4ed;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}.learning-card h3{font-size:clamp(20px,3vw,25px);margin:0}.learning-heading{display:flex;justify-content:space-between;align-items:start;gap:12px;flex-wrap:wrap}.learn-status{font-size:13px;font-weight:750;color:#325675;background:#eaf1f9;padding:6px 10px;border-radius:30px}.learning-illustration{font-size:68px;text-align:center;background:#e5f0fc;border-radius:14px;padding:14px}.learning-fact{font-size:17px;line-height:1.5;margin:0}.learning-card .safety{line-height:1.5}.learn-action{width:100%;margin-top:auto}.learn-action:disabled{opacity:1;cursor:default;background:#e0f3e7;color:#176039}@media(min-width:700px){.learning-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}.footer{text-align:center;color:#667287;font-size:13px;padding:20px}#status{min-height:24px}@media(max-width:440px){.nav button{padding:10px 7px;font-size:14px}.wrap{padding:10px}.hero{padding:18px 12px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style></head><body><header class="hero"><div class="wrap"><h1>🔧 Automotive Tech for Kids</h1><p>Explore cars, discover tools, and learn safely with Dad Dillian!</p></div></header><main class="wrap"><nav class="nav" aria-label="Main navigation"><button data-page="learn">Learn</button><button data-page="play">Play</button><button data-page="progress">Progress</button><button data-page="settings">Settings</button></nav><div id="app" aria-live="polite"></div><div id="status" role="status" aria-live="polite"></div></main><footer class="footer">Automotive Tech for Kids · v1.0.2 · Always ask a grown-up before touching real tools or vehicles.</footer><script>
'use strict';
const lessons=[
{id:'engine',icon:'⚙️',name:'Engine',fact:'The engine changes fuel energy into motion to help the car move.',safe:'A running engine has hot and moving parts. Only look with Dad nearby.',q:'What helps power a gasoline car?',options:['The engine','The seat belt','The mirror'],answer:0},
{id:'battery',icon:'🔋',name:'Battery',fact:'The 12-volt battery provides electrical power to start many cars and run equipment.',safe:'Never touch battery terminals or cables. Ask Dad for help.',q:'What provides electrical power to start many cars?',options:['The tires','The battery','The windshield'],answer:1},
{id:'tires',icon:'🛞',name:'Tires',fact:'Tires grip the road so a car can roll, turn, and stop.',safe:'Check tire appearance with Dad. Never crawl under a car.',q:'What grips the road?',options:['Tires','Headlights','Radio'],answer:0},
{id:'brakes',icon:'🛑',name:'Brakes',fact:'Brakes slow the wheels and help the car stop.',safe:'Brake parts can be hot. Only a trained adult should repair them.',q:'What helps a car slow down?',options:['Wipers','Brakes','Horn'],answer:1},
{id:'lights',icon:'💡',name:'Headlights',fact:'Headlights help the driver see the road and help other people see the car.',safe:'With the car parked and Dad present, you can point out the lights.',q:'What helps drivers see at night?',options:['Headlights','Seat cushions','Trunk'],answer:0},
{id:'wipers',icon:'🌧️',name:'Windshield Wipers',fact:'Wipers sweep rain and light debris from the windshield.',safe:'Keep fingers away when wipers move.',q:'What clears rain from the windshield?',options:['Tires','Wipers','Exhaust'],answer:1},
{id:'wrench',icon:'🔧',name:'Wrench',fact:'A wrench grips and turns nuts and bolts.',safe:'Practice on toy bolts with Dad, not on a real car.',q:'What tool turns nuts and bolts?',options:['Wrench','Flashlight','Tape measure'],answer:0},
{id:'screwdriver',icon:'🪛',name:'Screwdriver',fact:'A screwdriver turns screws using a tip that fits the screw head.',safe:'Use a child-safe practice kit with Dad. Never poke or pry.',q:'Which tool is made to turn screws?',options:['Hammer','Screwdriver','Pliers'],answer:1},
{id:'pliers',icon:'🗜️',name:'Pliers',fact:'Pliers help grip, bend, or hold small objects.',safe:'Watch your fingers near the jaws. Practice only with Dad.',q:'Which tool grips small objects?',options:['Pliers','Wipers','Funnel'],answer:0},
{id:'gauge',icon:'📏',name:'Tire Pressure Gauge',fact:'A tire pressure gauge measures the air pressure inside a tire.',safe:'Dad should handle real tire valves and inflation.',q:'Which tool measures air pressure in tires?',options:['Wrench','Pressure gauge','Screwdriver'],answer:1},
{id:'seatbelt',icon:'🧷',name:'Seat Belt',fact:'A seat belt helps protect people during sudden stops and crashes.',safe:'Buckle up on every ride. Children should use the right car seat or booster.',q:'What should you buckle before every ride?',options:['Seat belt','Toolbox','Wiper'],answer:0},
{id:'jack',icon:'🚗',name:'Car Jack',fact:'A jack can lift part of a vehicle so a trained adult can work on it.',safe:'Never go under a vehicle supported only by a jack. Children must stay clear.',q:'Who should operate a real car jack?',options:['A child alone','A trained adult','Anyone playing'],answer:1}
];
const challenges=[
{title:'Rainy Day',icon:'🌧️',story:'Rain starts falling while Dad is driving. What helps clear the windshield?',choices:['Wipers','Brakes','Wrench'],answer:0,why:'Wipers sweep rain away so the driver can see.'},
{title:'Loose Toy Bolt',icon:'🔩',story:'Dad sets up a pretend workbench with a toy nut and bolt. What should you choose?',choices:['Wrench','Tire','Seat belt'],answer:0,why:'A wrench fits and turns nuts and bolts.'},
{title:'Before the Ride',icon:'🚙',story:'You are ready to ride in the car. What is the first safe choice?',choices:['Open the hood','Buckle up correctly','Touch the engine'],answer:1,why:'Always buckle up in the correct child restraint.'},
{title:'Flat Tire',icon:'🛞',story:'You notice a tire looks flat. What should you do?',choices:['Crawl under the car','Inflate it alone','Tell Dad and stay clear'],answer:2,why:'Dad can inspect the tire and decide what to do safely.'},
{title:'Tool Detective',icon:'🪛',story:'Dad asks which tool is designed to turn a screw in a practice board.',choices:['Pliers','Screwdriver','Flashlight'],answer:1,why:'A screwdriver has a tip designed for screws.'},
{title:'Hot Engine',icon:'♨️',story:'A car just finished driving. What is safest?',choices:['Touch the engine','Let Dad handle it and stay back','Open the radiator cap'],answer:1,why:'Engines and cooling systems can be dangerously hot.'},
{title:'Dark Road',icon:'💡',story:'It is getting dark. Which car part helps the driver see?',choices:['Headlights','Door handle','Radio'],answer:0,why:'Headlights illuminate the road.'},
{title:'Stop Safely',icon:'🛑',story:'What system helps slow the car when Dad presses the brake pedal?',choices:['Wipers','Brakes','Horn'],answer:1,why:'The brake system slows the wheels.'}
];
const KEY='automotive-tech-kids-v1';const initial=()=>({learned:[],best:0,rounds:0,sound:false});let state=initial();try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&Array.isArray(saved.learned))state={...state,...saved}}catch(e){}let page='learn',lesson=0,round=0,score=0,answered=false,mode='quiz',order=[];
const el=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){document.getElementById('status').textContent='Progress could not be saved on this device. You can keep playing.';return false}}
function nav(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-current',b.dataset.page===p?'page':'false'));render();window.scrollTo({top:0,behavior:'instant'})}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>nav(b.dataset.page));
function render(){if(page==='learn')learn();else if(page==='play')play();else if(page==='progress')progress();else settings()}
function learn(){el.innerHTML='<section class="panel"><div class="topline"><h2>Explore the Garage</h2><span class="tag" id="learn-count">'+state.learned.length+'/'+lessons.length+' learned</span></div><p class="muted">Scroll through the cards to discover car parts and tools. Each card has a safety tip from Dad Dillian.</p><div class="learning-grid">'+lessons.map(l=>'<article class="learning-card" data-id="'+l.id+'"><div class="learning-heading"><h3>'+l.icon+' '+esc(l.name)+'</h3><span class="learn-status" aria-live="polite">'+(state.learned.includes(l.id)?'✓ Learned':'Not yet learned')+'</span></div><div class="learning-illustration" aria-hidden="true">'+l.icon+'</div><p class="learning-fact">'+esc(l.fact)+'</p><div class="safety"><strong>🧑‍🔧 Dad Dillian says:</strong> '+esc(l.safe)+'</div><button class="'+(state.learned.includes(l.id)?'secondary':'primary')+' learn-action" data-mark="'+l.id+'" '+(state.learned.includes(l.id)?'disabled':'')+'>'+(state.learned.includes(l.id)?'✓ Learned!':'I learned this! ✓')+'</button></article>').join('')+'</div></section>';el.querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>{const id=b.dataset.mark;if(state.learned.includes(id))return;state.learned.push(id);save();b.disabled=true;b.classList.remove('primary');b.classList.add('secondary');b.textContent='✓ Learned!';b.closest('.learning-card').querySelector('.learn-status').textContent='✓ Learned';el.querySelector('#learn-count').textContent=state.learned.length+'/'+lessons.length+' learned';document.getElementById('status').textContent='Great work! '+state.learned.length+' of '+lessons.length+' lessons learned.'})}
function start(m){mode=m;round=0;score=0;answered=false;order=(m==='quiz'?lessons.map((_,i)=>i):challenges.map((_,i)=>i)).sort(()=>Math.random()-.5).slice(0,m==='quiz'?8:6);drawQuestion()}
function play(){el.innerHTML='<section class="panel"><h2>🎮 Choose a Challenge</h2><p>Earn stars by answering questions. Mistakes are part of learning!</p><div class="cards"><button class="card" id="quiz"><span class="emoji">🧠</span><strong>Garage Quiz</strong><p>8 questions about cars and tools.</p></button><button class="card" id="mission"><span class="emoji">🏁</span><strong>Fix-It Missions</strong><p>6 safe, pretend workshop situations.</p></button></div><div class="safety" style="margin-top:16px">These are pretend challenges. Never repair or start a real vehicle without a responsible adult.</div></section>';el.querySelector('#quiz').onclick=()=>start('quiz');el.querySelector('#mission').onclick=()=>start('mission')}
function drawQuestion(){if(round>=order.length){state.rounds++;state.best=Math.max(state.best,score);save();el.innerHTML='<section class="panel" style="text-align:center"><div class="emoji">🏆</div><h2>Garage Challenge Complete!</h2><h3>'+score+' / '+order.length+' stars earned</h3><p>Dad Dillian says: Great job learning and practicing safe choices!</p><button class="primary" id="again">Play Again</button> <button class="secondary" id="back">Choose Challenge</button></section>';el.querySelector('#again').onclick=()=>start(mode);el.querySelector('#back').onclick=()=>nav('play');return}
const item=mode==='quiz'?lessons[order[round]]:challenges[order[round]];const choices=mode==='quiz'?item.options:item.choices;const question=mode==='quiz'?item.q:item.story;el.innerHTML='<section class="panel"><div class="topline"><span class="tag">'+(mode==='quiz'?'Garage Quiz':'Fix-It Mission')+'</span><strong>⭐ '+score+'</strong></div><p>Question '+(round+1)+' of '+order.length+'</p><div class="meter" aria-label="Challenge progress"><div style="width:'+100*round/order.length+'%"></div></div><div class="garage" aria-hidden="true">'+item.icon+'</div><h2>'+esc(question)+'</h2><div id="answers">'+choices.map((c,i)=>'<button class="answer" data-answer="'+i+'">'+esc(c)+'</button>').join('')+'</div><div id="feedback" role="status" aria-live="polite"></div><button class="secondary" id="quit">Leave Challenge</button></section>';answered=false;el.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const choice=Number(b.dataset.answer);const ok=choice===item.answer;if(ok)score++;el.querySelectorAll('[data-answer]').forEach(x=>{x.disabled=true;if(Number(x.dataset.answer)===item.answer)x.classList.add('correct');else if(Number(x.dataset.answer)===choice)x.classList.add('wrong')});const why=mode==='quiz'?item.fact:item.why;el.querySelector('#feedback').innerHTML='<div class="notice">'+(ok?'✅ Correct! You earned a star.':'💡 Good try! The correct answer is '+esc(choices[item.answer])+'.')+'<p>'+esc(why)+'</p><button class="primary" id="next">'+(round===order.length-1?'See Results':'Next Question →')+'</button></div>';el.querySelector('#next').onclick=()=>{round++;drawQuestion()}});el.querySelector('#quit').onclick=()=>nav('play')}
function progress(){el.innerHTML='<section class="panel"><h2>🏅 Your Garage Progress</h2><p>Parts and tools discovered: <strong>'+state.learned.length+' of '+lessons.length+'</strong></p><div class="meter"><div style="width:'+100*state.learned.length/lessons.length+'%"></div></div><p>Challenges completed: <strong>'+state.rounds+'</strong></p><p>Best challenge score: <strong>'+state.best+' stars</strong></p><h3>Badges</h3><div class="cards"><div class="card"><span class="emoji">🔧</span><strong>Tool Explorer</strong><p>'+(state.learned.length>=4?'✓ Earned':'Discover 4 items')+'</p></div><div class="card"><span class="emoji">🚘</span><strong>Garage Expert</strong><p>'+(state.learned.length===lessons.length?'✓ Earned':'Discover all 12 items')+'</p></div><div class="card"><span class="emoji">🏁</span><strong>Challenge Driver</strong><p>'+(state.rounds>=1?'✓ Earned':'Complete a challenge')+'</p></div></div></section>'}
function settings(){el.innerHTML='<section class="panel"><h2>⚙️ Settings</h2><p><strong>Version:</strong> 1.0.2</p><p><strong>Sound:</strong> Off. This app has no narration or sound effects.</p><p><strong>Privacy:</strong> Progress is stored only in this browser. No account or personal information is needed.</p><button class="secondary" id="export">Back Up Progress</button> <button class="secondary" id="import">Restore Progress</button><input type="file" accept=".json,application/json" id="file" hidden><p><button class="secondary" id="reset">Reset Progress</button></p><div class="safety">Always have Dad or another responsible adult supervise real-world activities. Never handle hot engines, moving parts, batteries, vehicle jacks, or traffic.</div></section>';el.querySelector('#export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='automotive-tech-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};el.querySelector('#import').onclick=()=>el.querySelector('#file').click();el.querySelector('#file').onchange=async e=>{try{const obj=JSON.parse(await e.target.files[0].text());if(!Array.isArray(obj.learned)||!Number.isFinite(obj.best)||!Number.isFinite(obj.rounds))throw Error();state={...initial(),learned:obj.learned.filter(x=>lessons.some(l=>l.id===x)),best:Math.max(0,Math.min(8,obj.best)),rounds:Math.max(0,obj.rounds)};save();settings();document.getElementById('status').textContent='Progress restored.'}catch(e){document.getElementById('status').textContent='That backup file could not be restored.'}};el.querySelector('#reset').onclick=()=>{if(confirm('Delete all saved garage progress on this device?')){state=initial();save();settings()}}}
nav('learn');if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
